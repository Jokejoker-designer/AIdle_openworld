<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="UCBV-001 U3 ten-module cozy architecture kit sheet">
  <title>UCBV-001 U3 Module Kit Sheet — ucbv_cozy_rounded_readable_v1</title>
  <desc>Ten allowlisted Block-DNA modules for Nori-7 matching construction family. Art metadata sheet; not mesh authority.</desc>
  <defs>
    <style>
      .bg { fill: #2a2622; }
      .panel { fill: #3a342e; stroke: #efe0c8; stroke-width: 2; rx: 12; }
      .title { fill: #fdf3e2; font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; }
      .sub { fill: #efe0c8; font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 14px; }
      .label { fill: #fdf3e2; font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .id { fill: #a8dced; font-family: Consolas, monospace; font-size: 11px; }
      .role { fill: #7fc98f; font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; }
      .cream { fill: #fdf3e2; }
      .warm { fill: #efe0c8; }
      .wood { fill: #c98a5e; }
      .roof { fill: #e88b6f; }
      .shade { fill: #d4785e; }
      .glass { fill: #a8dced; opacity: 0.75; }
      .door { fill: #c98a5e; }
      .stone { fill: #e0d5c4; }
      .cyan { fill: none; stroke: #3fd0e0; stroke-width: 2; stroke-dasharray: 6 4; }
      .outline { fill: none; stroke: #3d3226; stroke-width: 1.5; opacity: 0.35; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="40" y="48">UCBV-001 U3 · Cozy Architecture Kit (10 modules)</text>
  <text class="sub" x="40" y="72">family: ucbv_001_cozy_architecture_kit_v1 · style_lock: ucbv_001_style_lock_v1 · pair: Nori-7 / CCP-RH-001 · allowlist-only · accepted=false</text>

  <!-- Row 1 cells -->
  <!-- 0 foundation block_platform -->
  <g transform="translate(40,100)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">foundation</text>
    <text class="id" x="14" y="40">block_platform</text>
    <rect class="stone" x="40" y="150" width="140" height="28" rx="8"/>
    <rect class="warm" x="48" y="145" width="124" height="18" rx="6"/>
    <rect class="outline" x="40" y="145" width="140" height="33" rx="8"/>
    <text class="label" x="14" y="220">4.0×4.0×0.3 · snap_grid</text>
  </g>
  <!-- 1 floor -->
  <g transform="translate(280,100)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">floor</text>
    <text class="id" x="14" y="40">arch_floor_round_4m</text>
    <rect class="warm" x="35" y="130" width="150" height="22" rx="11"/>
    <rect class="wood" x="45" y="120" width="130" height="8" rx="3"/>
    <text class="label" x="14" y="220">4m deck · vertical_stack</text>
  </g>
  <!-- 2 wall -->
  <g transform="translate(520,100)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">wall</text>
    <text class="id" x="14" y="40">block_panel</text>
    <rect class="cream" x="70" y="70" width="80" height="130" rx="10"/>
    <rect class="wood" x="70" y="185" width="80" height="10" rx="3"/>
    <text class="label" x="14" y="220">4.0×2.8×0.25 · snap_grid</text>
  </g>
  <!-- 3 corner -->
  <g transform="translate(760,100)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">corner</text>
    <text class="id" x="14" y="40">block_cube_round</text>
    <rect class="cream" x="75" y="70" width="70" height="130" rx="18"/>
    <rect class="warm" x="75" y="185" width="70" height="12" rx="4"/>
    <text class="label" x="14" y="220">1.0 pier · rounded</text>
  </g>
  <!-- 4 door -->
  <g transform="translate(1000,100)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">door</text>
    <text class="id" x="14" y="40">arch_door_round</text>
    <path class="door" d="M85 190 V90 A30 30 0 0 1 145 90 V190 Z"/>
    <circle class="wood" cx="130" cy="140" r="5"/>
    <text class="label" x="14" y="220">door_leaf · MAT_CozyDoor</text>
  </g>

  <!-- Row 2 -->
  <!-- 5 window -->
  <g transform="translate(40,370)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">window</text>
    <text class="id" x="14" y="40">arch_window_frame_simple</text>
