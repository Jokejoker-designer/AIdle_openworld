    <rect class="glass" x="65" y="95" width="90" height="70" rx="4"/>
    <text class="label" x="14" y="220">window_frame · thick</text>
  </g>
  <!-- 6 roof -->
  <g transform="translate(280,370)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">roof</text>
    <text class="id" x="14" y="40">arch_roof_dome_4m</text>
    <ellipse class="roof" cx="110" cy="140" rx="80" ry="45"/>
    <ellipse class="shade" cx="110" cy="155" rx="80" ry="18"/>
    <rect class="wood" x="30" y="165" width="160" height="8" rx="3"/>
    <text class="label" x="14" y="220">dome · roof_edge</text>
  </g>
  <!-- 7 fence -->
  <g transform="translate(520,370)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">fence</text>
    <text class="id" x="14" y="40">block_beam</text>
    <rect class="wood" x="50" y="90" width="14" height="90" rx="4"/>
    <rect class="wood" x="156" y="90" width="14" height="90" rx="4"/>
    <rect class="wood" x="50" y="110" width="120" height="12" rx="3"/>
    <rect class="wood" x="50" y="145" width="120" height="12" rx="3"/>
    <text class="label" x="14" y="220">chunky posts · fence mats</text>
  </g>
  <!-- 8 prop -->
  <g transform="translate(760,370)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">prop</text>
    <text class="id" x="14" y="40">prop_crate_small</text>
    <rect class="wood" x="70" y="110" width="80" height="70" rx="10"/>
    <rect class="outline" x="70" y="110" width="80" height="70" rx="10"/>
    <text class="label" x="14" y="220">prop_base · wood</text>
  </g>
  <!-- 9 wall_door -->
  <g transform="translate(1000,370)">
    <rect class="panel" width="220" height="240" rx="12"/>
    <text class="role" x="14" y="22">wall_door (10th)</text>
    <text class="id" x="14" y="40">arch_wall_door_4m</text>
    <rect class="cream" x="40" y="70" width="50" height="130" rx="8"/>
    <rect class="cream" x="130" y="70" width="50" height="130" rx="8"/>
    <rect class="cream" x="40" y="70" width="140" height="30" rx="8"/>
    <path class="cyan" d="M95 200 V100 A20 20 0 0 1 135 100 V200"/>
    <text class="label" x="14" y="220">door_opening · wall_edge</text>
  </g>

  <text class="sub" x="40" y="640">Manifestation: wireframe → hologram → materializing → complete (cyan reserved). Build states: preview / valid / invalid / selected / materializing / complete.</text>
  <text class="sub" x="40" y="662">Sockets reused from Block-DNA contracts only. Preferred U1 ids outside allowlist remapped (foundation/wall/fence). Physics Tier3 unbound residual.</text>
  <text class="sub" x="40" y="684">Palette G1 cream · G2 leaf (Nori/prop accent) · G3 wood/glass/roof · MAT_* runtime SSOT · DNA cream/leaf alias only.</text>
  <text class="sub" x="40" y="706">PATCH_DRAFT · next U4 character mesh/rig · no runtime patch (U5) · no grandchildren · self_accept=false</text>
</svg>
