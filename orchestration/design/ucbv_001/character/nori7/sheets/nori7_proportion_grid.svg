<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-label="Nori-7 proportion grid 2 heads tall">
  <title>Nori-7 Proportion Grid — 2 Heads Tall</title>
  <desc>Head-unit grid for CCP-RH-001. Base height 2.0 HU; sprout tip ~2.4 HU. U2 design only.</desc>
  <rect width="1100" height="700" fill="#f7f1e6"/>
  <text x="36" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3d3226" font-weight="700">Nori-7 Proportion Guide (2 HU chibi)</text>
  <text x="36" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6b5d4d">1 HU = head vertical span · ground Y=0 · style_lock ucbv_001_style_lock_v1 · CCP-RH-001</text>

  <!-- Front with grid -->
  <g transform="translate(220,560)">
    <!-- HU grid boxes -->
    <g stroke="#c98a5e" stroke-width="1.5" fill="none" opacity="0.85">
      <rect x="-100" y="-320" width="200" height="160"/>
      <rect x="-100" y="-160" width="200" height="160"/>
      <text x="110" y="-240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c98a5e">1 HU</text>
      <text x="110" y="-80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c98a5e">1 HU</text>
    </g>
    <!-- sprout zone -->
    <rect x="-40" y="-384" width="80" height="64" fill="none" stroke="#7fc98f" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="50" y="-350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7fc98f">sprout ~0.4 HU</text>
    <!-- figure -->
    <ellipse cx="-28" cy="-14" rx="16" ry="9" fill="#efe0c8" stroke="#3d3226" stroke-width="2"/>
    <ellipse cx="28" cy="-14" rx="16" ry="9" fill="#efe0c8" stroke="#3d3226" stroke-width="2"/>
    <rect x="-38" y="-60" width="20" height="48" rx="10" fill="#fdf3e2" stroke="#3d3226" stroke-width="2"/>
    <rect x="18" y="-60" width="20" height="48" rx="10" fill="#fdf3e2" stroke="#3d3226" stroke-width="2"/>
    <path d="M0,-320 C75,-320 100,-230 100,-150 C100,-70 55,-30 0,-30 C-55,-30 -100,-70 -100,-150 C-100,-230 -75,-320 0,-320 Z" fill="#fdf3e2" stroke="#3d3226" stroke-width="2.5"/>
    <ellipse cx="-28" cy="-230" rx="20" ry="24" fill="#3d3226"/>
    <ellipse cx="28" cy="-230" rx="20" ry="24" fill="#3d3226"/>
    <ellipse cx="-28" cy="-230" rx="12" ry="14" fill="#a8dced"/>
    <ellipse cx="28" cy="-230" rx="12" ry="14" fill="#a8dced"/>
    <rect x="-5" y="-380" width="10" height="62" rx="4" fill="#7fc98f" stroke="#3d3226" stroke-width="1.5"/>
    <ellipse cx="-12" cy="-386" rx="15" ry="11" fill="#7fc98f" stroke="#3d3226" stroke-width="1.5"/>
    <ellipse cx="16" cy="-388" rx="17" ry="12" fill="#95d9a3" stroke="#3d3226" stroke-width="1.5"/>
    <!-- dimension arrows -->
    <line x1="-130" y1="0" x2="-130" y2="-320" stroke="#3d3226" stroke-width="1.5"/>
    <text x="-195" y="-150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3d3226">2.0 HU</text>
    <line x1="-130" y1="-320" x2="-130" y2="-384" stroke="#7fc98f" stroke-width="1.5"/>
    <text x="-210" y="-350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7fc98f">+sprout</text>
    <text x="-70" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3d3226" font-weight="600">FRONT</text>
  </g>

  <!-- Side with depth -->
  <g transform="translate(620,560)">
    <g stroke="#c98a5e" stroke-width="1.5" fill="none" opacity="0.85">
      <rect x="-90" y="-320" width="180" height="160"/>
      <rect x="-90" y="-160" width="180" height="160"/>
    </g>
    <ellipse cx="10" cy="-12" rx="20" ry="8" fill="#efe0c8" stroke="#3d3226" stroke-width="2"/>
    <rect x="-2" y="-58" width="20" height="48" rx="10" fill="#fdf3e2" stroke="#3d3226" stroke-width="2"/>
    <path d="M-5,-310 C45,-320 80,-250 82,-160 C84,-80 45,-30 8,-28 C-30,-26 -50,-70 -48,-150 C-46,-230 -45,-300 -5,-310 Z" fill="#fdf3e2" stroke="#3d3226" stroke-width="2.5"/>
    <ellipse cx="-55" cy="-155" rx="30" ry="50" fill="#efe0c8" stroke="#3d3226" stroke-width="2"/>
    <path d="M-30,-210 Q5,-235 40,-205" fill="none" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="48" cy="-145" rx="16" ry="28" fill="#fdf3e2" stroke="#3d3226" stroke-width="2"/>
    <ellipse cx="42" cy="-220" rx="12" ry="20" fill="#3d3226"/>
    <ellipse cx="44" cy="-220" rx="7" ry="12" fill="#a8dced"/>
    <rect x="8" y="-375" width="9" height="68" rx="4" fill="#7fc98f" stroke="#3d3226" stroke-width="1.5"/>
    <ellipse cx="4" cy="-382" rx="13" ry="10" fill="#7fc98f" stroke="#3d3226" stroke-width="1.5"/>
    <ellipse cx="26" cy="-384" rx="15" ry="11" fill="#95d9a3" stroke="#3d3226" stroke-width="1.5"/>
    <!-- depth callouts -->
    <line x1="-90" y1="-40" x2="80" y2="-40" stroke="#6b5d4d" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="-40" y="-48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b5d4d">body depth ~0.9 HU</text>
    <line x1="-88" y1="-155" x2="-20" y2="-155" stroke="#c98a5e" stroke-width="1.5"/>
    <text x="-120" y="-165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c98a5e">tank +0.35–0.40 HU</text>
    <text x="-30" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3d3226" font-weight="600">SIDE</text>
  </g>

  <!-- Callout panel -->
  <g transform="translate(820,100)" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#3d3226">
    <rect x="0" y="0" width="250" height="420" rx="12" fill="#fffaf2" stroke="#e0d5c4" stroke-width="2"/>
    <text x="16" y="32" font-size="15" font-weight="700">Locked numbers</text>
    <text x="16" y="60" font-size="12">Base height: 2.0 HU</text>
    <text x="16" y="82" font-size="12">Sprout tip: ~2.40 HU</text>
    <text x="16" y="104" font-size="12">Head radius: ~0.50 HU</text>
    <text x="16" y="126" font-size="12">Max width: 1.00–1.10 HU</text>
    <text x="16" y="148" font-size="12">Leg length: ~0.35 HU</text>
    <text x="16" y="170" font-size="12">Tank H: 0.55–0.65 HU</text>
    <text x="16" y="192" font-size="12">Eye H: 0.20–0.24 HU</text>
    <text x="16" y="230" font-size="13" font-weight="700">Rear mandatory</text>
    <text x="16" y="252" font-size="12">• sprout tip</text>
    <text x="16" y="274" font-size="12">• water tank bulk</text>
    <text x="16" y="310" font-size="13" font-weight="700">Palette SSOT</text>
    <text x="16" y="332" font-size="12">Bible cream #fdf3e2</text>
    <text x="16" y="354" font-size="12">Leaf #7fc98f</text>
    <text x="16" y="376" font-size="12">DNA #F7E9C6 alias only</text>
    <text x="16" y="408" font-size="11" fill="#6b5d4d">No world-grid joint snap</text>
  </g>

  <text x="36" y="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6b5d4d">U2 PATCH_DRAFT · accepted=false · relative scale vs wall module ~0.45–0.55 wall height · not production CAD meters</text>
</svg>
