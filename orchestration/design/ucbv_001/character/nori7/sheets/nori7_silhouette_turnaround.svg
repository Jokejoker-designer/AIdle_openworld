<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-label="Nori-7 CCP-RH-001 silhouette turnaround sheet U2">
  <title>Nori-7 / CCP-RH-001 — U2 Silhouette Turnaround</title>
  <desc>Front, three-quarter, side, and back silhouettes plus black-mass row. Style lock ucbv_001_style_lock_v1. Design metadata only — not production mesh.</desc>
  <rect width="1400" height="780" fill="#f7f1e6"/>
